[package]
name         = "aozora-cli"
description  = "The `aozora` command-line tool: fmt, lint, render, explain, and lsp"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true
readme       = "README.md"

[[bin]]
name = "aozora"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
aozora             = { workspace = true }   # render: Document::parse().to_html()
aozora-diagnostics = { workspace = true }   # lint/explain: shared catalogue
aozora-fmt         = { workspace = true }   # `fmt` subcommand + shared plumbing
aozora-lsp         = { workspace = true }   # `lsp` subcommand: serve()

clap     = { workspace = true }
anyhow   = { workspace = true }
anstream = { workspace = true }
anstyle  = { workspace = true }
serde    = { workspace = true }
serde_json = { workspace = true }
tokio    = { workspace = true }   # `aozora lsp` runtime

annotate-snippets     = { workspace = true }   # rustc-style terminal diagnostics
notify-debouncer-mini = { workspace = true }   # `lint --watch`
ctrlc                 = { workspace = true }   # clean `--watch` teardown
opener                = { workspace = true }   # `render --open`

# `aozora completions <shell>` / `aozora man` runtime generators.
clap_complete         = { workspace = true }
clap_complete_nushell = { workspace = true }
clap_mangen           = { workspace = true }

[build-dependencies]
toml  = { workspace = true }   # parse Cargo.lock for the aozora rev
serde = { workspace = true }

[lints]
workspace = true
