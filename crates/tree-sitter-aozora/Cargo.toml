[package]
name        = "tree-sitter-aozora"
description = "Tree-sitter grammar for aozora-flavored markdown — used by aozora-lsp for incremental parsing"
version     = "0.1.0"
edition     = "2024"
license     = "Apache-2.0 OR MIT"
publish     = false

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = { version = "1", features = ["parallel"] }

[dev-dependencies]
tree-sitter = "0.26"

# parser.c is committed (generated from grammar.js); building needs only a C toolchain.
