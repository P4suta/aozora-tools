# doc_markdown: domain terms that shouldn't need backticks in docs.
doc-valid-idents = [
    "..",
    "Aozora",
    "DashMap",
    "GitHub",
    "JIS",
    "JSON-RPC",
    "Marketplace",
    "Open VSX",
    "Shift_JIS",
    "TextDocument",
    "TextEdit",
    "UTF-8",
    "UTF-16",
    "VSCodium",
    "vscode-languageclient",
]

# Complexity thresholds — tighter than clippy defaults. Wrap >4 args in a struct.
too-many-arguments-threshold = 4
too-many-lines-threshold = 80
cognitive-complexity-threshold = 18
type-complexity-threshold = 250  # default; LSP types have wide generic surfaces
max-fn-params-bools = 1          # ≥2 bool params: use an enum
enum-variant-name-threshold = 2
enum-variant-size-threshold = 256

msrv = "1.96.0"  # matches rust-toolchain.toml

# Tests may use unwrap/expect/panic as diagnostic shortcuts; production stays strict.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

avoid-breaking-exported-api = false  # crates are pre-1.0
pass-by-value-size-limit = 128       # surface by-value moves of fat structs (default 200)

# Banned std calls (bug-sources or wrong layer).
disallowed-methods = [
    { path = "std::mem::forget", reason = "leaks destructors; use `ManuallyDrop` or explicit drop" },
    { path = "std::env::set_var", reason = "races with other threads; wire via Options instead" },
    { path = "std::env::remove_var", reason = "see std::env::set_var" },
    { path = "std::process::exit", reason = "bypasses destructors; use `ExitCode` / return from main" },
]

# Banned types.
disallowed-types = [
    { path = "std::sync::RwLock", reason = "tokio / parking_lot preferred where available; raise an ADR to opt in" },
]
