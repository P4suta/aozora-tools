[workspace]
resolver = "3"
# Explicit list (no glob): `crates/aozora-tools-book/` is an mdbook tree, not a crate.
members = [
    "crates/aozora-fmt",
    "crates/aozora-lsp",
    "crates/aozora-tools-xtask",
    "crates/tree-sitter-aozora",
]

[workspace.package]
version      = "0.1.3"
edition      = "2024"
rust-version = "1.95.0"
license      = "Apache-2.0 OR MIT"
authors      = ["aozora-tools contributors"]
repository   = "https://github.com/P4suta/aozora-tools"
homepage     = "https://github.com/P4suta/aozora-tools"
keywords     = ["aozora", "japanese", "lsp", "formatter", "tree-sitter"]
categories   = ["development-tools", "command-line-utilities", "text-editors"]

[workspace.dependencies]
# Parser ecosystem (sibling repo). Pinned by immutable rev, not tag. rev = v0.4.1.
aozora          = { version = "0.4.1", git = "https://github.com/P4suta/aozora.git", rev = "a53c632b1d1be4bfcbce7de010ab5b0843e98cc0" }
aozora-encoding = { version = "0.4.1", git = "https://github.com/P4suta/aozora.git", rev = "a53c632b1d1be4bfcbce7de010ab5b0843e98cc0" }

# Internal workspace members
aozora-fmt         = { version = "0.1.3", path = "crates/aozora-fmt" }
# Explicit version (not path-only) so cargo-deny's `bans.wildcards = "deny"` accepts it.
tree-sitter-aozora = { version = "0.1.0", path = "crates/tree-sitter-aozora" }

# CLI
clap   = { version = "4.6.1", features = ["derive", "wrap_help"] }
anyhow = "1.0"

# LSP runtime
tower-lsp          = "0.20"
tokio              = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "sync", "time"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
dashmap            = "6"
parking_lot        = "0.12"  # non-poisoning Mutex for the writer-only BufferState
arc-swap           = "1.7"   # wait-free read snapshot swap
ropey              = "1.6"   # chunked Rope; feeds tree-sitter parse_with without a contiguous String
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Test-only
proptest = "1"
shuttle  = "0.9"   # randomized concurrency model checker (shuttle feature; see tests/shuttle_doc_state.rs)

hdrhistogram = { version = "7.5", default-features = false }  # constant-memory percentile tracking for Metrics

[workspace.lints.rust]
unsafe_code      = "forbid"
non_ascii_idents = "deny"   # 日本語 only as string literals, never idents

missing_debug_implementations = "warn"
missing_copy_implementations  = "warn"
trivial_casts                 = "warn"
trivial_numeric_casts         = "warn"
unused_import_braces          = "warn"
unused_lifetimes              = "warn"
unused_qualifications         = "warn"

unreachable_pub                = "warn"
single_use_lifetimes           = "warn"
elided_lifetimes_in_paths      = "warn"
redundant_lifetimes            = "warn"
explicit_outlives_requirements = "warn"

let_underscore_drop         = "warn"
keyword_idents_2024         = "warn"
variant_size_differences    = "warn"
ambiguous_negative_literals = "warn"

# `deny` (not the default `warn`) so a local `cargo build` without `-D warnings` still fails.
dead_code = "deny"

rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links       = "deny"
private_intra_doc_links      = "warn"
invalid_codeblock_attributes = "warn"
invalid_html_tags            = "warn"
invalid_rust_codeblocks      = "warn"
bare_urls                    = "warn"
redundant_explicit_links     = "warn"
unescaped_backticks          = "warn"

[workspace.lints.clippy]
# `priority = -1` lets the carve-outs below override individual lints in these groups.
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }

multiple_crate_versions = "allow"  # transitive dep collisions we can't fix locally
# Contradicts `unreachable_pub`, which we keep; narrow visibility is the better signal.
redundant_pub_crate = "allow"

# High-value promotions (tests exempt unwrap/expect/panic via clippy.toml).
dbg_macro                  = "warn"
todo                       = "warn"
unimplemented              = "warn"
clone_on_ref_ptr           = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc     = "warn"
missing_assert_message     = "warn"

# Hand-picked restriction lints (the full group has mutually contradictory entries).
str_to_string                   = "warn"
absolute_paths                  = "warn"
allow_attributes_without_reason = "warn"  # every allow must carry a reason
empty_structs_with_brackets     = "warn"
if_then_some_else_none          = "warn"
let_underscore_must_use         = "warn"
mixed_read_write_in_expression  = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method                = "warn"
semicolon_outside_block         = "warn"
try_err                         = "warn"
unneeded_field_pattern          = "warn"
verbose_file_reads              = "warn"
format_push_string              = "warn"
unnecessary_self_imports        = "warn"
assertions_on_result_states     = "warn"
filetype_is_file                = "warn"  # doesn't follow symlinks
rc_buffer                       = "warn"
rc_mutex                        = "warn"
lossy_float_literal             = "warn"
suspicious_xor_used_as_pow      = "warn"  # `2 ^ 8` is xor, not power

module_name_repetitions = "allow"  # module name is often the domain term
missing_const_for_fn    = "allow"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = 3

# Distribution profile (aozora-lsp bundled in the .vsix). Optimises for size over speed.
[profile.dist]
inherits      = "release"
opt-level     = "z"
lto           = "fat"
codegen-units = 1
strip         = "symbols"

# Release optimisation plus debug info so `samply` can symbolicate bench binaries.
[profile.bench]
inherits = "release"
strip    = "none"
debug    = 1

# `split-debuginfo` speeds incremental link; opt-level=1 on deps only keeps workspace
# crates at 0 for fast iteration while proptest/criterion/tower-lsp run faster.
[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
